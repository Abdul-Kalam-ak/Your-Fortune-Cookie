<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Cookie — a small boost, whenever you need one</title>
<meta name="description" content="Crack open a virtual fortune cookie for a few honest, comforting words.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<main class="app" id="app">

  <!-- SCREEN 1: Landing + moment choice -->
  <section class="screen screen--landing active" data-screen="landing" aria-labelledby="landing-title">
    <p class="wordmark"><span class="wordmark-emoji" aria-hidden="true">🥠</span>Ak Fortune&nbsp;Cookie</p>
    <h1 id="landing-title" class="tagline">Good news is one crack away.</h1>
    <p class="hero-sub">A small honest truth, picked for exactly how you feel right now — not everyone else.</p>

    <h2 class="question">What's today calling for?</h2>

    <div class="choice-row" role="group" aria-label="Choose your moment">
      <button type="button" class="choice-card choice-card--morning" data-action="choose-moment" data-value="morning">
        <svg class="choice-icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="10" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="24" y1="2" x2="24" y2="9"/>
            <line x1="24" y1="39" x2="24" y2="46"/>
            <line x1="2" y1="24" x2="9" y2="24"/>
            <line x1="39" y1="24" x2="46" y2="24"/>
            <line x1="8.5" y1="8.5" x2="13.5" y2="13.5"/>
            <line x1="34.5" y1="34.5" x2="39.5" y2="39.5"/>
            <line x1="39.5" y1="8.5" x2="34.5" y2="13.5"/>
            <line x1="13.5" y1="34.5" x2="8.5" y2="39.5"/>
          </g>
        </svg>
        <span class="choice-label">Start My Day</span>
      </button>

      <button type="button" class="choice-card choice-card--badday" data-action="choose-moment" data-value="bad_day">
        <svg class="choice-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M14 27a8 8 0 0 1 1-15.9A10 10 0 0 1 34 13a7.5 7.5 0 0 1-1 14.9H14Z" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="16" y1="33" x2="13" y2="39"/>
            <line x1="24" y1="33" x2="21" y2="41"/>
            <line x1="32" y1="33" x2="29" y2="39"/>
          </g>
        </svg>
        <span class="choice-label">I'm Having a Bad Day</span>
      </button>
    </div>
  </section>

  <!-- SCREEN 2: Preference choice -->
  <section class="screen" data-screen="preference" aria-labelledby="preference-title">
    <button type="button" class="back-btn" data-action="back">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>
    <h2 id="preference-title" class="question question--alone">How would you like your fortune?</h2>

    <div class="choice-row choice-row--three" role="group" aria-label="Choose who this fortune is for">
      <button type="button" class="choice-card choice-card--pref choice-card--him" data-action="choose-pref" data-value="male">
        <span class="choice-label">For&nbsp;Him</span>
      </button>
      <button type="button" class="choice-card choice-card--pref choice-card--her" data-action="choose-pref" data-value="female">
        <span class="choice-label">For&nbsp;Her</span>
      </button>
      <button type="button" class="choice-card choice-card--pref choice-card--everyone" data-action="choose-pref" data-value="general">
        <span class="choice-label">For&nbsp;Everyone</span>
      </button>
    </div>
  </section>

  <!-- SCREEN 3: Cookie + reveal -->
  <section class="screen" data-screen="cookie" aria-labelledby="cookie-title">
    <button type="button" class="back-btn" data-action="back">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </button>

    <p id="cookie-title" class="waiting-text">Your cookie is waiting.</p>

    <div class="cookie-stage">
      <div class="crumbs" id="crumbs" aria-hidden="true"></div>

      <div class="cookie" id="cookie" role="button" tabindex="0" aria-label="Tap, hold, or press Enter to crack your cookie">
        <div class="cookie-half cookie-half--left"></div>
        <div class="cookie-half cookie-half--right"></div>
        <div class="crack-line" aria-hidden="true"></div>

        <div class="paper" id="paper">
          <p class="paper-text" id="fortuneText" aria-live="polite" aria-atomic="true"></p>
        </div>
      </div>
    </div>

    <p class="tap-hint" id="tapHint" aria-hidden="true">Tap the cookie, or pull it apart ✨</p>

    <div class="reveal-actions" id="revealActions" hidden>
      <p class="take-with">Take this with you today.</p>
      <div class="action-row">
        <button type="button" class="ghost-btn" id="againBtn">Crack Another Cookie</button>
        <button type="button" class="ghost-btn" id="shareBtn">Share This Fortune</button>
      </div>
      <button type="button" class="start-over" id="startOverBtn">Start over</button>
    </div>
  </section>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</main>

<script src="script.js"></script>
</body>
</html>
